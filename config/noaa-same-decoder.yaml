# =============================================================================
#  NOAA Weather Radio SAME Decoder - AI-Thinker ESP32-Audio-Kit (ESP32-A1S / ES8388)
#  Repo location: config/noaa-same-decoder.yaml
# =============================================================================

substitutions:
  device_name: "noaa-same-decoder"

esphome:
  name: ${device_name}
  friendly_name: "NOAA SAME Decoder"
  on_boot:
    priority: -100
    then:
      - lambda: 'ESP_LOGI("same", "Boot complete; SAME decoder starting.");'
      - select.set:
          id: same_adc_input
          option: "LINE1"
      # ES8388 input PGA gain (ADCControl1 = reg 0x09):
      #   0x88=+24dB (over-drove line-in) | 0x77=+21dB (current) | 0x66=+18dB | 0x44=+12dB
      # Raised to +21 dB per testing: more analog gain, less software gain = cleaner.
      - delay: 200ms
      - lambda: |-
          std::vector<uint8_t> buf;
          buf.push_back(0x09);
          buf.push_back(0x77);                       // +21 dB L & R
          id(bus_a).write(0x10, buf.data(), buf.size());
          uint8_t reg = 0x09;
          uint8_t readback = 0;
          id(bus_a).write(0x10, &reg, 1, false);
          id(bus_a).read(0x10, &readback, 1);
          ESP_LOGI("es8388", "ADCControl1 wrote 0x77, readback=0x%02X", readback);
      - microphone.capture: same_mic

esp32:
  board: esp-wrover-kit
  framework:
    type: esp-idf
    advanced:
      minimum_chip_revision: "3.1"
      sram1_as_iram: true
psram:
  mode: quad
  speed: 80MHz

logger:
  level: DEBUG                          # DEBUG for testing; raise to INFO in production

time:
  - platform: homeassistant
    id: ha_time
    on_time_sync:
      then:
        - lambda: 'ESP_LOGI("same", "Time synced from Home Assistant.");'

api:
  encryption:
    key: !secret noaa_same_decoder__encryption_key
  reboot_timeout: 30min
  max_send_queue: 20
  on_client_connected:
    - lambda: 'id(same_dec).set_api_connected(true);'
  on_client_disconnected:
    - lambda: 'id(same_dec).set_api_connected(false);'

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  ap:
    ssid: "${device_name} Fallback"
    password: !secret fallback_password

captive_portal:

debug:
  update_interval: 30s

external_components:
  - source:
      type: git
      url: https://github.com/infinitytec/ESPHome-SAME-Decoder
      ref: main
    components: [same_decoder]
    refresh: 0s

i2c:
  sda: GPIO33
  scl: GPIO32
  frequency: 100kHz
  id: bus_a

audio_dac:
  - platform: es8388
    id: es8388_codec
    i2c_id: bus_a
    address: 0x10

select:
  - platform: es8388
    es8388_id: es8388_codec
    adc_input_mic:
      id: same_adc_input
      name: "SAME ADC Input (LINE1=Line-In, LINE2=Mic)"
      disabled_by_default: true

i2s_audio:
  - id: i2s_in
    i2s_lrclk_pin: GPIO25
    i2s_bclk_pin: GPIO27
    i2s_mclk_pin: GPIO0

microphone:
  - platform: i2s_audio
    id: same_mic
    i2s_audio_id: i2s_in
    adc_type: external
    i2s_din_pin: GPIO35
    sample_rate: 48000
    bits_per_sample: 16bit
    channel: right
    on_data:
      then:
        - lambda: |-
            id(same_dec).feed_bytes(x);

button:
  - platform: restart
    name: "Restart"
    id: same_restart
    icon: "mdi:restart"

interval:
  - interval: 2s
    then:
      - if:
          condition:
            api.connected:
          then:
            - lambda: 'id(same_dec).set_api_connected(true);'
          else:
            - lambda: 'id(same_dec).set_api_connected(false);'

output:
  - platform: gpio
    id: led_decode_output
    pin:
      number: GPIO22
      inverted: true

binary_sensor:
  - platform: template
    id: decode_in_progress
    name: "SAME Decode In Progress"
    icon: "mdi:access-point"

number:
  - platform: template
    name: "SAME Software Gain"
    id: same_gain_number
    icon: "mdi:volume-high"
    min_value: 1
    max_value: 512
    step: 1
    mode: slider
    optimistic: true
    restore_value: true
    initial_value: 256          # lowered: analog PGA now carries more of the gain
    set_action:
      - lambda: 'id(same_dec).set_gain(x);'

  - platform: template
    name: "SAME Burst Timeout"
    id: same_timeout_number
    icon: "mdi:timer-sand"
    unit_of_measurement: "s"
    min_value: 1
    max_value: 30
    step: 1
    mode: slider
    optimistic: true
    restore_value: true
    initial_value: 3
    entity_category: config
    set_action:
      - lambda: 'id(same_dec).set_timeout_ms((uint32_t) (x * 1000.0f));'

sensor:
  - platform: template
    id: same_decode_count
    name: "SAME Decodes (session)"
    accuracy_decimals: 0
    unit_of_measurement: "decodes"

  - platform: wifi_signal
    name: "RSSI"
    id: rssi_dbm
    update_interval: 60s
    unit_of_measurement: "dBm"
    device_class: signal_strength
    entity_category: diagnostic
    disabled_by_default: true

  - platform: debug
    free:
      name: "Memory Free"
      id: mem_free_pct
      unit_of_measurement: "%"
      accuracy_decimals: 0
      icon: "mdi:memory"
      entity_category: diagnostic
      disabled_by_default: true
      filters:
        - lambda: |-
            float total = (float) heap_caps_get_total_size(MALLOC_CAP_INTERNAL);
            if (total <= 0) return 0.0;
            return x / total * 100.0;

text_sensor:
  - platform: template
    id: same_last_raw
    name: "SAME Last Raw Header"

  - platform: template
    id: same_last_alert_time
    name: "SAME Last Alert Time"
    device_class: timestamp
    entity_category: diagnostic

same_decoder:
  id: same_dec
  gain: 256.0                    # matches the lowered slider default
  sample_rate: 48000
  decode_count_sensor: same_decode_count
  last_raw_sensor: same_last_raw
  on_sync:
    then:
      - output.turn_on: led_decode_output
      - lambda: 'id(decode_in_progress).publish_state(true);'
      - delay: 8s
      - output.turn_off: led_decode_output
      - lambda: 'id(decode_in_progress).publish_state(false);'
  on_alert:
    then:
      - output.turn_off: led_decode_output
      - lambda: 'id(decode_in_progress).publish_state(false);'
      - lambda: |-
          auto t = id(ha_time).now();
          if (t.is_valid()) {
            char buf[40];
            t.strftime(buf, sizeof(buf), "%Y-%m-%dT%H:%M:%S%z");
            id(same_last_alert_time).publish_state(buf);
          } else {
            ESP_LOGW("same", "Alert decoded but time not synced yet; timestamp not published.");
          }
      - homeassistant.event:
          event: esphome.same_alert
          data:
            id: !lambda 'return id(same_dec).last_alert_id();'
            event_code: !lambda 'return id(same_dec).last_event_code();'
            event: !lambda 'return id(same_dec).last_event_name();'
            severity: !lambda 'return id(same_dec).last_severity();'
            originator: !lambda 'return id(same_dec).last_originator();'
            status: !lambda 'return id(same_dec).last_status();'
            areas: !lambda 'return id(same_dec).last_areas_csv();'
            onset: !lambda 'return id(same_dec).last_onset_iso();'
            expires: !lambda 'return id(same_dec).last_expires_iso();'
            sender: !lambda 'return id(same_dec).last_sender();'
            raw: !lambda 'return id(same_dec).last_raw_header();'
