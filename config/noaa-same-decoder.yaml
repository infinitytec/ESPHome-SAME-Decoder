# =============================================================================
#  NOAA Weather Radio SAME Decoder - AI-Thinker ESP32-Audio-Kit (ESP32-A1S / ES8388)
#  Get NOAA Weather Radio SAME alerts in Home Assistant via ESPHome
#  Source, disclaimers, and more: https://github.com/infinitytec/ESPHome-SAME-Decoder
# =============================================================================

substitutions:
  device_name: "noaa-same-decoder"

esphome:
  name: ${device_name}
  friendly_name: "NOAA SAME Decoder"
  on_boot:
    priority: -100
    then:
      - lambda: 'ESP_LOGI("same", "Boot complete; SAME decoder starting.");'
      - lambda: 'id(decode_in_progress).publish_state(false);'
      - output.turn_off: d4_led
      - delay: 200ms
      - lambda: |-
          std::vector<uint8_t> buf;
          buf.push_back(0x09);
          buf.push_back(0x77);
          id(bus_a).write(0x10, buf.data(), buf.size());
          uint8_t reg = 0x09;
          uint8_t readback = 0;
          id(bus_a).write(0x10, &reg, 1, false);
          id(bus_a).read(0x10, &readback, 1);
          ESP_LOGI("es8388", "ADCControl1 wrote 0x77, readback=0x%02X", readback);
      - microphone.capture: same_mic
      # Give the es8388/microphone components time to finish their own init,
      # then apply our output-path setup so it wins over their register writes.
      - delay: 1500ms
      - script.execute: apply_speaker_path
      # Re-apply a few more times over the next few seconds (guarded read-before-write
      # inside the script) to defeat any late writes from the audio stack.
      - delay: 1000ms
      - script.execute: apply_speaker_path
      - delay: 1000ms
      - script.execute: apply_speaker_path

esp32:
  board: esp-wrover-kit
  framework:
    type: esp-idf
    advanced:
      minimum_chip_revision: "3.1"
      sram1_as_iram: true
psram:
  mode: quad
  speed: 80MHz

logger:
  level: DEBUG

time:
  - platform: homeassistant
    id: ha_time
    on_time_sync:
      then:
        - lambda: 'ESP_LOGI("same", "Time synced from Home Assistant.");'

api:
  encryption:
    key: !secret noaa_same_decoder__encryption_key
  reboot_timeout: 30min
  max_send_queue: 20
  on_client_connected:
    - lambda: 'id(same_dec).set_api_connected(true);'
  on_client_disconnected:
    - lambda: 'id(same_dec).set_api_connected(false);'

ota:
  - platform: esphome
    password: !secret ota_password

web_server:
  port: 80
  version: 3
  local: true
  auth:
    username: !secret web_server_username
    password: !secret web_server_password
    type: digest
  include_internal: false

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  ap:
    ssid: "${device_name} Fallback"
    password: !secret fallback_password

  use_address: 192.168.90.27
captive_portal:

debug:
  update_interval: 30s

external_components:
  - source:
      type: git
      url: https://github.com/infinitytec/ESPHome-SAME-Decoder
      ref: main
    components: [same_decoder]
    refresh: 0s

i2c:
  sda: GPIO33
  scl: GPIO32
  frequency: 100kHz
  id: bus_a

audio_dac:
  - platform: es8388
    id: es8388_codec
    i2c_id: bus_a
    address: 0x10

i2s_audio:
  - id: i2s_in
    i2s_lrclk_pin: GPIO25
    i2s_bclk_pin: GPIO27
    i2s_mclk_pin: GPIO0

microphone:
  - platform: i2s_audio
    id: same_mic
    i2s_audio_id: i2s_in
    adc_type: external
    i2s_din_pin: GPIO35
    sample_rate: 48000
    bits_per_sample: 16 bit
    channel: right
    on_data:
      then:
        - lambda: |-
            id(same_dec).feed_bytes(x);

# --- ES8388 output-path setup, as a re-runnable script ---
# Enables LOUT2, un-mutes DAC, sets LMIXSEL=LIN2 (line-in), stages LI2LO off.
# Uses read-before-write guards so re-applying is cheap and pop-free.
script:
  - id: apply_speaker_path
    then:
      - lambda: |-
          auto es_write = [](uint8_t reg, uint8_t val) {
            uint8_t b[2] = { reg, val };
            id(bus_a).write(0x10, b, 2);
          };
          auto es_read = [](uint8_t reg) -> uint8_t {
            uint8_t cur = 0x00;
            id(bus_a).write(0x10, &reg, 1, false);
            id(bus_a).read(0x10, &cur, 1);
            return cur;
          };

          bool changed = false;

          // Reg 2 (Chip Power Mgmt): power up DAC digital + DAC analog reference.
          {
            uint8_t v = es_read(0x02);
            uint8_t nv = v;
            nv &= ~(1 << 6);   // dac_DigPDN -> normal
            nv &= ~(1 << 0);   // dacVref_PDN -> power up
            if (nv != v) { es_write(0x02, nv); changed = true; }
          }
          // Reg 4 (DAC Power Mgmt): power up left DAC, enable LOUT2 (bit3).
          {
            uint8_t v = es_read(0x04);
            uint8_t nv = v;
            nv &= ~(1 << 7);   // PdnDACL -> left DAC power up
            nv |=  (1 << 3);   // LOUT2 enable
            if (nv != v) { es_write(0x04, nv); changed = true; }
          }
          // Reg 25 (DAC Control 3): ensure DAC analog output NOT muted (clear DACMute bit2).
          {
            uint8_t v = es_read(0x19);
            uint8_t nv = v;
            nv &= ~(1 << 2);   // DACMute -> normal (un-muted)
            if (nv != v) { es_write(0x19, nv); changed = true; }
          }
          // Reg 38 (DAC Control 16): LMIXSEL=001 (LIN2) for the left mixer.
          {
            uint8_t v = es_read(0x26);
            if (v != 0x08) { es_write(0x26, 0x08); changed = true; }
          }
          // Reg 52 (DAC Control 30): known-good LOUT2/mixer reference bits (default 0xAA).
          {
            uint8_t v = es_read(0x34);
            if (v != 0xAA) { es_write(0x34, 0xAA); changed = true; }
          }

          // Re-apply the current speaker volume (Reg 48 = LOUT2VOL).
          {
            uint8_t vol = (uint8_t) id(speaker_volume_number).state;
            if (vol > 33) vol = 33;
            uint8_t cur = es_read(0x30);
            if (cur != vol) { es_write(0x30, vol); changed = true; }
          }

          // If the passthrough switch is ON, make sure LI2LO stays enabled.
          {
            uint8_t v = es_read(0x27);
            bool want_on = id(linein_passthrough).state;
            uint8_t nv = v;
            if (want_on) nv |= (1 << 6); else nv &= ~(1 << 6);
            if (nv != v) { es_write(0x27, nv); changed = true; }
          }

          ESP_LOGI("es8388", "apply_speaker_path: LOUT2/LMIXSEL=LIN2/unmute applied (changed=%d).", (int) changed);

output:
  # Decode indicator LED on GPIO22 (proven-good pin). On at ZCZC sync, off at EOM.
  # Active-low on this board. (Physically the D4 LED; GPIO19/D5 conflicts with the audio path.)
  - platform: gpio
    id: d4_led
    pin:
      number: GPIO22
      inverted: true

button:
  - platform: restart
    name: "Restart"
    id: same_restart
    icon: "mdi:restart"

  # Manually re-run the ES8388 output-path setup (useful for debugging; logs are
  # visible over the network once connected, unlike boot-time logs).
  - platform: template
    name: "Re-apply Codec Init"
    id: reapply_codec_init
    icon: "mdi:cog-refresh"
    entity_category: config
    on_press:
      then:
        - script.execute: apply_speaker_path

# KEY1 (IO36): toggle Line-In -> LEFT speaker passthrough.
binary_sensor:
  - platform: template
    id: decode_in_progress
    name: "SAME Decode In Progress"
    icon: "mdi:access-point"

  - platform: gpio
    id: key1_button
    name: "KEY1 (Line-In Passthrough)"
    pin:
      number: GPIO36
      mode:
        input: true
      inverted: true
    on_press:
      then:
        - switch.toggle: linein_passthrough

interval:
  - interval: 2s
    then:
      - if:
          condition:
            api.connected:
          then:
            - lambda: 'id(same_dec).set_api_connected(true);'
          else:
            - lambda: 'id(same_dec).set_api_connected(false);'

  # Active-alert expiry sweep + scroll advance (runs every second).
  - interval: 1s
    then:
      - lambda: |-
          uint32_t now = 0;
          auto t = id(ha_time).now();
          bool valid = t.is_valid();
          if (valid) now = (uint32_t) t.timestamp;

          if (valid) {
            int w = 0;
            for (int r = 0; r < id(active_count); r++) {
              if (id(active_expiry_ts)[r] > now) {
                id(active_name)[w]       = id(active_name)[r];
                id(active_end)[w]        = id(active_end)[r];
                id(active_severity_l)[w] = id(active_severity_l)[r];
                id(active_expiry_ts)[w]  = id(active_expiry_ts)[r];
                w++;
              }
            }
            id(active_count) = w;
          }

          int best = 0;  // 0 none,1 Minor,2 Moderate,3 Severe,4 Extreme
          for (int i = 0; i < id(active_count); i++) {
            const std::string &s = id(active_severity_l)[i];
            int rank = 0;
            if      (s == "Extreme")  rank = 4;
            else if (s == "Severe")   rank = 3;
            else if (s == "Moderate") rank = 2;
            else if (s == "Minor")    rank = 1;
            if (rank > best) best = rank;
          }
          id(active_severity) = (best == 4) ? "Extreme"
                              : (best == 3) ? "Severe"
                              : (best == 2) ? "Moderate"
                              : (best == 1) ? "Minor" : "";

          if (id(active_count) > 0)
            id(active_scroll_idx) = (id(active_scroll_idx) + 1) % id(active_count);
          else
            id(active_scroll_idx) = 0;

globals:
  - id: active_name
    type: std::vector<std::string>
    restore_value: no
  - id: active_end
    type: std::vector<std::string>
    restore_value: no
  - id: active_severity_l
    type: std::vector<std::string>
    restore_value: no
  - id: active_expiry_ts
    type: std::vector<uint32_t>
    restore_value: no
  - id: active_count
    type: int
    restore_value: no
    initial_value: '0'
  - id: active_scroll_idx
    type: int
    restore_value: no
    initial_value: '0'
  - id: active_severity
    type: std::string
    restore_value: no
    initial_value: '""'

text:
  - platform: template
    name: "SAME County Codes"
    id: same_allowed_counties
    icon: "mdi:map-marker-multiple"
    mode: text
    optimistic: true
    restore_value: true
    initial_value: ""
    entity_category: config
    min_length: 0
    max_length: 255

number:
  - platform: template
    name: "SAME Software Gain"
    id: same_gain_number
    icon: "mdi:volume-high"
    min_value: 1
    max_value: 512
    step: 1
    mode: slider
    entity_category: diagnostic
    optimistic: true
    restore_value: true
    initial_value: 256
    set_action:
      - lambda: 'id(same_dec).set_gain(x);'

  # Speaker (LOUT2) volume: ES8388 Reg 48 (LOUT2VOL): 0=-45dB ... 30=0dB ... 33=+4.5dB.
  - platform: template
    name: "Speaker Volume"
    id: speaker_volume_number
    icon: "mdi:volume-high"
    min_value: 0
    max_value: 33
    step: 1
    mode: slider
    optimistic: true
    restore_value: true
    initial_value: 30
    set_action:
      - lambda: |-
          uint8_t v = (uint8_t) x;
          if (v > 33) v = 33;
          uint8_t b[2] = { 0x30, v };   // Reg 48 = 0x30, LOUT2VOL
          id(bus_a).write(0x10, b, 2);
          ESP_LOGI("es8388", "Speaker Volume: LOUT2VOL=%u (Reg48=0x%02X).", v, v);

  - platform: template
    name: "SAME Burst Timeout"
    id: same_timeout_number
    icon: "mdi:timer-sand"
    unit_of_measurement: "s"
    min_value: 1
    max_value: 30
    step: 1
    mode: slider
    optimistic: true
    restore_value: true
    initial_value: 3
    entity_category: diagnostic
    set_action:
      - lambda: 'id(same_dec).set_timeout_ms((uint32_t) (x * 1000.0f));'

  - platform: template
    name: "SAME Decode Watchdog"
    id: same_watchdog_number
    icon: "mdi:timer-lock"
    unit_of_measurement: "s"
    min_value: 2
    max_value: 60
    step: 1
    mode: slider
    optimistic: true
    restore_value: true
    initial_value: 10
    entity_category: diagnostic
    disabled_by_default: true
    set_action:
      - lambda: 'id(same_dec).set_decode_watchdog_ms((uint32_t) (x * 1000.0f));'

  - platform: template
    name: "SAME Re-emit Suppress Window"
    id: same_resend_suppress_number
    icon: "mdi:timer-refresh"
    unit_of_measurement: "s"
    min_value: 0
    max_value: 900
    step: 1
    mode: slider
    optimistic: true
    restore_value: true
    initial_value: 3
    entity_category: diagnostic
    disabled_by_default: true
    set_action:
      - lambda: 'id(same_dec).set_resend_suppress_ms((uint32_t) (x * 1000.0f));'

  - platform: template
    name: "SAME Preamble Energy Mult"
    id: same_pre_energy_number
    icon: "mdi:sine-wave"
    min_value: 2.0
    max_value: 50.0
    step: 0.5
    mode: slider
    optimistic: true
    restore_value: true
    initial_value: 8.0
    entity_category: diagnostic
    disabled_by_default: true
    set_action:
      - lambda: 'id(same_dec).set_preamble_energy_mult(x);'

# --- Per-event-code allow/mute toggles ---
switch:
  # Line-In -> LEFT speaker passthrough (single source of truth; KEY1 toggles it).
  - platform: template
    name: "Enable Speaker"
    id: linein_passthrough
    icon: "mdi:speaker"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action:
      - lambda: |-
          uint8_t reg = 0x27, cur = 0x00;
          id(bus_a).write(0x10, &reg, 1, false);
          id(bus_a).read(0x10, &cur, 1);
          cur |= (1 << 6);   // LI2LO enable
          uint8_t b[2] = { 0x27, cur };
          id(bus_a).write(0x10, b, 2);
          ESP_LOGI("es8388", "Line-In -> LEFT speaker ENABLED (Reg39=0x%02X).", cur);
    turn_off_action:
      - lambda: |-
          uint8_t reg = 0x27, cur = 0x00;
          id(bus_a).write(0x10, &reg, 1, false);
          id(bus_a).read(0x10, &cur, 1);
          cur &= ~(1 << 6);  // LI2LO disable
          uint8_t b[2] = { 0x27, cur };
          id(bus_a).write(0x10, b, 2);
          ESP_LOGI("es8388", "Line-In -> LEFT speaker DISABLED (Reg39=0x%02X).", cur);

  - platform: template
    name: "SAME Allow: EAN (Emergency Action Notification)"
