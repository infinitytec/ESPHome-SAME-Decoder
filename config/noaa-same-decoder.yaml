# =============================================================================
#  NOAA Weather Radio SAME Decoder — AI-Thinker ESP32-Audio-Kit (ESP32-A1S / ES8388)
# -----------------------------------------------------------------------------
#  HA-only filtering model:
#    * The device decodes SAME and fires esphome.same_alert for EVERY alert.
#    * Home Assistant (via ha/same_alerts_package.yaml) does FIPS + include/
#      ignore filtering, builds the nws_alerts-style entity, and prunes expiry.
#    * Each event carries a stable `id` (hash of event_code+areas+issue time)
#      so HA upserts on re-broadcast/updates instead of duplicating.
# =============================================================================

substitutions:
  device_name: "noaa-same-decoder"

esphome:
  name: ${device_name}
  friendly_name: "NOAA SAME Decoder"
  on_boot:
    priority: -100
    then:
      - lambda: 'ESP_LOGI("same", "Boot complete; SAME decoder starting.");'

esp32:
  board: esp-wrover-kit
  framework:
    type: esp-idf

psram:
  mode: quad
  speed: 80MHz

logger:
  level: INFO

api:
  # Required for the device to fire esphome.same_alert on the HA event bus.

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${device_name} Fallback"
    password: !secret fallback_password

captive_portal:

# -----------------------------------------------------------------------------
#  Custom SAME decoder external component from GitHub.
#  path: same_decoder matches the current repo layout (Root/same_decoder/).
# -----------------------------------------------------------------------------
external_components:
  - source:
      type: git
      url: https://github.com/infinitytec/ESPHome-SAME-Decoder
      ref: main
      path: same_decoder
    components: [same_decoder]
    refresh: 1d

# -----------------------------------------------------------------------------
#  ES8388 codec (analog LINE-IN feeds its ADC)
# -----------------------------------------------------------------------------
i2c:
  sda: GPIO33
  scl: GPIO32
  frequency: 100kHz
  id: bus_a

audio_dac:
  - platform: es8388
    id: es8388_codec
    i2c_id: bus_a
    address: 0x10

select:
  - platform: es8388
    es8388_id: es8388_codec
    adc_input_mic:
      name: "SAME ADC Input"
      initial_option: DIFFERENCE      # LINE1=left | LINE2=right | DIFFERENCE=both
    dac_output:
      name: "SAME DAC Output"

i2s_audio:
  - id: i2s_in
    i2s_lrclk_pin: GPIO25
    i2s_bclk_pin: GPIO27
    i2s_mclk_pin: GPIO0

switch:
  - platform: gpio
    pin: GPIO21
    id: amp_ctrl
    name: "Audio Amp"
    restore_mode: ALWAYS_OFF

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO39
      inverted: true
    name: "Line-In Jack Present"

# Diagnostic-only device entities. The AUTHORITATIVE nws_alerts-style sensor
# is built in Home Assistant from the fired events (see ha/ package).
sensor:
  - platform: template
    id: same_decode_count
    name: "SAME Decodes (session)"
    accuracy_decimals: 0
    unit_of_measurement: "decodes"

text_sensor:
  - platform: template
    id: same_last_raw
    name: "SAME Last Raw Header"

# -----------------------------------------------------------------------------
#  Decoder wiring. It fires esphome.same_alert for EVERY decoded alert.
#  Field annotations:
#    REAL      = present in the SAME header
#    DERIVED   = computed from a SAME field (code map, purge->timestamp, hash)
#    (SAME has NO Headline/Description/Instruction/URL/Certainty — omitted.)
# -----------------------------------------------------------------------------
same_decoder:
  id: same_dec
  i2s_audio_id: i2s_in
  i2s_din_pin: GPIO35
  sample_rate: 48000
  # Diagnostic sinks:
  decode_count_sensor: same_decode_count
  last_raw_sensor: same_last_raw
  # Fire one HA event per decoded alert, carrying the full payload:
  on_alert:
    then:
      - homeassistant.event:
          event: esphome.same_alert
          data:
            id: !lambda 'return id(same_dec).last_alert_id();'          # DERIVED (stable hash)
            event_code: !lambda 'return id(same_dec).last_event_code();' # REAL (EEE)
            event: !lambda 'return id(same_dec).last_event_name();'      # DERIVED (code -> name)
            severity: !lambda 'return id(same_dec).last_severity();'     # DERIVED (code -> tier)
            originator: !lambda 'return id(same_dec).last_originator();' # REAL (ORG)
            status: !lambda 'return id(same_dec).last_status();'         # DERIVED (Actual/Test)
            areas: !lambda 'return id(same_dec).last_areas_csv();'       # REAL (PSSCCC list)
            onset: !lambda 'return id(same_dec).last_onset_iso();'       # DERIVED (JJJHHMM -> ISO)
            expires: !lambda 'return id(same_dec).last_expires_iso();'   # DERIVED (purge -> ISO)
            sender: !lambda 'return id(same_dec).last_sender();'         # REAL (LLLLLLLL)
            raw: !lambda 'return id(same_dec).last_raw_header();'        # REAL (full ZCZC-...)
