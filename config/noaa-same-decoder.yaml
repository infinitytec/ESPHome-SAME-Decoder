sensor:
  - platform: template
    id: same_decode_count
    name: "SAME Decodes (session)"
    accuracy_decimals: 0
    unit_of_measurement: "decodes"

  - platform: wifi_signal
    name: "RSSI"
    id: rssi_dbm
    update_interval: 60s
    unit_of_measurement: "dBm"
    device_class: signal_strength
    entity_category: diagnostic
    disabled_by_default: true

  - platform: debug
    free:
      name: "Memory Free"
      id: mem_free_pct
      unit_of_measurement: "%"
      accuracy_decimals: 0
      icon: "mdi:memory"
      entity_category: diagnostic
      disabled_by_default: true
      filters:
        - lambda: |-
            float total = (float) heap_caps_get_total_size(MALLOC_CAP_INTERNAL);
            if (total <= 0) return 0.0;
            return x / total * 100.0;

text_sensor:
  - platform: template
    id: same_last_raw
    name: "SAME Last Raw Header"

  - platform: template
    id: same_last_raw_all
    name: "SAME Last Raw Header (All)"

  - platform: template
    id: same_last_alert_time
    name: "SAME Last Alert Time"
    device_class: timestamp
    entity_category: diagnostic

  - platform: template
    id: same_last_preamble_time
    name: "SAME Last Preamble Time"
    device_class: timestamp
    entity_category: diagnostic
    disabled_by_default: true

same_decoder:
  id: same_dec
  gain: 8.0
  freq_offset_hz: 0.0
  agc_enable: false
  agc_target: 8000
  agc_min_gain: 0.25
  agc_max_gain: 32.0
  timeout_ms: 3000
  single_burst_min_ms: 3000
  post_emit_dead_ms: 500
  sample_rate: 48000
  resend_suppress_ms: 3000
  preamble_lock_bits: 32
  preamble_energy_mult: 8.0
  preamble_balance_max: 0.40
  lock_confidence_min: 0.5
  residual_drift_ppm: 12000.0
  fallback_conf_thresh: 0.20
  fallback_kp: 0.06
  fallback_ki: 0.0015
  eom_require_context: true
  eom_context_ms: 120000
  decode_watchdog_ms: 7500
  decode_count_sensor: same_decode_count
  on_sync:
    then:
      - lambda: 'id(decode_in_progress).publish_state(true);'
      - output.turn_on: d4_led
  on_preamble:
    then:
      - lambda: |-
          auto t = id(ha_time).now();
          if (t.is_valid()) {
            std::string ts = t.strftime("%Y-%m-%dT%H:%M:%S%z");
            id(same_last_preamble_time).publish_state(ts);
          } else {
            ESP_LOGW("same", "Preamble heard but time not synced yet; timestamp not published.");
          }
  on_alert:
    then:
      - lambda: 'id(decode_in_progress).publish_state(false);'
      - lambda: |-
          auto t = id(ha_time).now();
          if (t.is_valid()) {
            std::string ts = t.strftime("%Y-%m-%dT%H:%M:%S%z");
            id(same_last_alert_time).publish_state(ts);
          } else {
            ESP_LOGW("same", "Alert decoded but time not synced yet; timestamp not published.");
          }
      - lambda: |-
          id(same_last_raw_all).publish_state(id(same_dec).last_raw_header());
      - lambda: |-
          auto allow_code = [](const std::string &code) -> bool {
            if (code == "EAN") return id(mute_ean).state;
            if (code == "EAT") return id(mute_eat).state;
            if (code == "NIC") return id(mute_nic).state;
            if (code == "NPT") return id(mute_npt).state;
            if (code == "NAT") return id(mute_nat).state;
            if (code == "NST") return id(mute_nst).state;
            if (code == "BZW") return id(mute_bzw).state;
            if (code == "CFA") return id(mute_cfa).state;
            if (code == "CFW") return id(mute_cfw).state;
            if (code == "DSW") return id(mute_dsw).state;
            if (code == "EWW") return id(mute_eww).state;
            if (code == "FFA") return id(mute_ffa).state;
            if (code == "FFW") return id(mute_ffw).state;
            if (code == "FFS") return id(mute_ffs).state;
            if (code == "FLA") return id(mute_fla).state;
            if (code == "FLW") return id(mute_flw).state;
            if (code == "FLS") return id(mute_fls).state;
            if (code == "FZW") return id(mute_fzw).state;
            if (code == "HWA") return id(mute_hwa).state;
            if (code == "HWW") return id(mute_hww).state;
            if (code == "HUA") return id(mute_hua).state;
            if (code == "HUW") return id(mute_huw).state;
            if (code == "HLS") return id(mute_hls).state;
            if (code == "HWO") return id(mute_hwo).state;
            if (code == "MWS") return id(mute_mws).state;
            if (code == "SVA") return id(mute_sva).state;
            if (code == "SVR") return id(mute_svr).state;
            if (code == "SVS") return id(mute_svs).state;
            if (code == "SQW") return id(mute_sqw).state;
            if (code == "SMW") return id(mute_smw).state;
            if (code == "SPS") return id(mute_sps).state;
            if (code == "SSA") return id(mute_ssa).state;
            if (code == "SSW") return id(mute_ssw).state;
            if (code == "TOA") return id(mute_toa).state;
            if (code == "TOR") return id(mute_tor).state;
            if (code == "TRA") return id(mute_tra).state;
            if (code == "TRW") return id(mute_trw).state;
            if (code == "TSA") return id(mute_tsa).state;
            if (code == "TSW") return id(mute_tsw).state;
            if (code == "WSA") return id(mute_wsa).state;
            if (code == "WSW") return id(mute_wsw).state;
            if (code == "AVA") return id(mute_ava).state;
            if (code == "AVW") return id(mute_avw).state;
            if (code == "BLU") return id(mute_blu).state;
            if (code == "CAE") return id(mute_cae).state;
            if (code == "CDW") return id(mute_cdw).state;
            if (code == "CEM") return id(mute_cem).state;
            if (code == "EQW") return id(mute_eqw).state;
            if (code == "EVI") return id(mute_evi).state;
            if (code == "FRW") return id(mute_frw).state;
            if (code == "HMW") return id(mute_hmw).state;
            if (code == "LEW") return id(mute_lew).state;
            if (code == "LAE") return id(mute_lae).state;
            if (code == "TOE") return id(mute_toe).state;
            if (code == "NMN") return id(mute_nmn).state;
            if (code == "NUW") return id(mute_nuw).state;
            if (code == "RHW") return id(mute_rhw).state;
            if (code == "SPW") return id(mute_spw).state;
            if (code == "VOW") return id(mute_vow).state;
            if (code == "NEM") return id(mute_nem).state;
            if (code == "ADR") return id(mute_adr).state;
            if (code == "DMO") return id(mute_dmo).state;
            if (code == "RMT") return id(mute_rmt).state;
            if (code == "RWT") return id(mute_rwt).state;
            return true;
          };
          auto tail5 = [](const std::string &s) -> std::string {
            if (s.size() >= 6) return s.substr(1);
            return s;
          };

          std::string counties_raw = id(same_allowed_counties).state;
          std::string areas_raw = id(same_dec).last_areas_csv();
          std::string code = id(same_dec).last_event_code();

          std::vector<std::string> allowed;
          {
            std::string cur;
            for (char ch : counties_raw) {
              if (ch == ',' || ch == ' ') {
                if (!cur.empty()) { allowed.push_back(tail5(cur)); cur.clear(); }
              } else { cur += ch; }
            }
            if (!cur.empty()) allowed.push_back(tail5(cur));
          }

          bool county_ok = allowed.empty();
          if (!county_ok) {
            std::string cur;
            std::vector<std::string> area_tails;
            for (char ch : areas_raw) {
              if (ch == ',' || ch == ' ') {
                if (!cur.empty()) { area_tails.push_back(tail5(cur)); cur.clear(); }
              } else { cur += ch; }
            }
            if (!cur.empty()) area_tails.push_back(tail5(cur));
            for (auto &at : area_tails) {
              for (auto &al : allowed) {
                if (at == al) { county_ok = true; break; }
              }
              if (county_ok) break;
            }
          }

          bool code_ok = allow_code(code);
          bool pass = county_ok && code_ok;

          ESP_LOGI("same", "Filter: code=%s code_ok=%d county_ok=%d -> %s",
                   code.c_str(), (int) code_ok, (int) county_ok,
                   pass ? "DELIVER" : "SUPPRESS");

          if (pass) {
            id(same_last_raw).publish_state(id(same_dec).last_raw_header());

            // Compute expiry from the SAME "+TTTT" purge duration in the raw header.
            std::string timing = id(same_dec).last_raw_header();
            uint32_t dur_sec = 30 * 60;
            {
              size_t p = timing.find('+');
              if (p != std::string::npos && timing.size() >= p + 5) {
                std::string tttt = timing.substr(p + 1, 4);
                if (tttt.size() == 4 &&
                    isdigit((unsigned char)tttt[0]) && isdigit((unsigned char)tttt[1]) &&
                    isdigit((unsigned char)tttt[2]) && isdigit((unsigned char)tttt[3])) {
                  int hh = (tttt[0]-'0')*10 + (tttt[1]-'0');
                  int mm = (tttt[2]-'0')*10 + (tttt[3]-'0');
                  dur_sec = (uint32_t)(hh * 3600 + mm * 60);
                  if (dur_sec == 0) dur_sec = 30 * 60;
                }
              }
            }

            uint32_t now = 0;
            auto tt = id(ha_time).now();
            if (tt.is_valid()) now = (uint32_t) tt.timestamp;
            uint32_t expiry = now + dur_sec;

            std::string name = id(same_dec).last_event_name();
            std::string sev  = id(same_dec).last_severity();

            std::string end_str = "?";
            if (tt.is_valid()) {
              int total_min = tt.hour * 60 + tt.minute + (int)(dur_sec / 60);
              total_min %= (24 * 60);
              if (total_min < 0) total_min += (24 * 60);
              int eh = total_min / 60;
              int em = total_min % 60;
              char eb[8];
              snprintf(eb, sizeof(eb), "%02d:%02d", eh, em);
              end_str = std::string(eb);
            }

            int found = -1;
            for (int i = 0; i < id(active_count); i++) {
              if (id(active_name)[i] == name) { found = i; break; }
            }
            if (found >= 0) {
              id(active_end)[found]        = end_str;
              id(active_severity_l)[found] = sev;
              id(active_expiry_ts)[found]  = expiry;
            } else if (id(active_count) < 8) {
              id(active_name).push_back(name);
              id(active_end).push_back(end_str);
              id(active_severity_l).push_back(sev);
              id(active_expiry_ts).push_back(expiry);
              id(active_count) = id(active_count) + 1;
            }
          }
      - if:
          condition:
            lambda: |-
              auto allow_code = [](const std::string &code) -> bool {
                if (code == "EAN") return id(mute_ean).state;
                if (code == "EAT") return id(mute_eat).state;
                if (code == "NIC") return id(mute_nic).state;
                if (code == "NPT") return id(mute_npt).state;
