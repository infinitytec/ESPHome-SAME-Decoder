# =============================================================================
#  NOAA Weather Radio SAME Decoder - AI-Thinker ESP32-Audio-Kit (ESP32-A1S / ES8388)
#  Get NOAA Weather Radio SAME alerts in Home Assistant via ESPHome
#  Source, disclaimers, and more: https://github.com/infinitytec/ESPHome-SAME-Decoder
# =============================================================================

substitutions:
  device_name: "noaa-same-decoder"

esphome:
  name: ${device_name}
  friendly_name: "NOAA SAME Decoder"
  on_boot:
    priority: -100
    then:
      - lambda: 'ESP_LOGI("same", "Boot complete; SAME decoder starting.");'
      - output.turn_off: led_decode_output
      - lambda: 'id(decode_in_progress).publish_state(false);'
      - select.set:
          id: same_adc_input
          option: "LINE1"
      - delay: 200ms
      - lambda: |-
          std::vector<uint8_t> buf;
          buf.push_back(0x09);
          buf.push_back(0x77);
          id(bus_a).write(0x10, buf.data(), buf.size());
          uint8_t reg = 0x09;
          uint8_t readback = 0;
          id(bus_a).write(0x10, &reg, 1, false);
          id(bus_a).read(0x10, &readback, 1);
          ESP_LOGI("es8388", "ADCControl1 wrote 0x77, readback=0x%02X", readback);
      - microphone.capture: same_mic

esp32:
  board: esp-wrover-kit
  framework:
    type: esp-idf
    advanced:
      minimum_chip_revision: "3.1"
      sram1_as_iram: true
psram:
  mode: quad
  speed: 80MHz

logger:
  level: DEBUG

time:
  - platform: homeassistant
    id: ha_time
    on_time_sync:
      then:
        - lambda: 'ESP_LOGI("same", "Time synced from Home Assistant.");'

api:
  encryption:
    key: !secret noaa_same_decoder__encryption_key
  reboot_timeout: 30min
  max_send_queue: 20
  on_client_connected:
    - lambda: 'id(same_dec).set_api_connected(true);'
  on_client_disconnected:
    - lambda: 'id(same_dec).set_api_connected(false);'

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  ap:
    ssid: "${device_name} Fallback"
    password: !secret fallback_password

captive_portal:

debug:
  update_interval: 30s

external_components:
  - source:
      type: git
      url: https://github.com/infinitytec/ESPHome-SAME-Decoder
      ref: main
    components: [same_decoder]
    refresh: 0s

i2c:
  sda: GPIO33
  scl: GPIO32
  frequency: 100kHz
  id: bus_a

audio_dac:
  - platform: es8388
    id: es8388_codec
    i2c_id: bus_a
    address: 0x10

select:
  - platform: es8388
    es8388_id: es8388_codec
    adc_input_mic:
      id: same_adc_input
      name: "SAME ADC Input (LINE1=Line-In, LINE2=Mic)"
      disabled_by_default: true

i2s_audio:
  - id: i2s_in
    i2s_lrclk_pin: GPIO25
    i2s_bclk_pin: GPIO27
    i2s_mclk_pin: GPIO0

microphone:
  - platform: i2s_audio
    id: same_mic
    i2s_audio_id: i2s_in
    adc_type: external
    i2s_din_pin: GPIO35
    sample_rate: 48000
    bits_per_sample: 16 bit
    channel: right
    on_data:
      then:
        - lambda: |-
            id(same_dec).feed_bytes(x);

button:
  - platform: restart
    name: "Restart"
    id: same_restart
    icon: "mdi:restart"

interval:
  - interval: 2s
    then:
      - if:
          condition:
            api.connected:
          then:
            - lambda: 'id(same_dec).set_api_connected(true);'
          else:
            - lambda: 'id(same_dec).set_api_connected(false);'

output:
  - platform: gpio
    id: led_decode_output
    pin:
      number: GPIO22
      inverted: true

binary_sensor:
  - platform: template
    id: decode_in_progress
    name: "SAME Decode In Progress"
    icon: "mdi:access-point"

globals:
  - id: led_on_since
    type: uint32_t
    restore_value: no
    initial_value: '0'

# Runtime-editable list of allowed county (SAME/FIPS) codes.
# Enter one or more 6-digit codes (PSSCCC), comma-separated, e.g. "020173,020177".
# Partial-county (P-digit) is ignored: matching is done on the last 5 digits (SSCCC),
# so a code like 120173 (P=1) still matches an entered 020173 for the same county.
# An EMPTY list means "no location filter" (all areas pass).
text:
  - platform: template
    name: "SAME Allowed Counties"
    id: same_allowed_counties
    icon: "mdi:map-marker-multiple"
    mode: text
    optimistic: true
    restore_value: true
    initial_value: ""
    entity_category: config
    min_length: 0
    max_length: 255

script:
  - id: led_indicate_on
    then:
      - output.turn_on: led_decode_output
      - lambda: 'id(decode_in_progress).publish_state(true); id(led_on_since) = millis();'

  - id: led_indicate_off
    mode: restart
    then:
      - delay: !lambda 'uint32_t e = millis() - id(led_on_since); return (e < 2000) ? (2000 - e) : 0;'
      - output.turn_off: led_decode_output
      - lambda: 'id(decode_in_progress).publish_state(false);'

number:
  - platform: template
    name: "SAME Software Gain"
    id: same_gain_number
    icon: "mdi:volume-high"
    min_value: 1
    max_value: 512
    step: 1
    mode: slider
    entity_category: diagnostic
    optimistic: true
    restore_value: true
    initial_value: 256
    set_action:
      - lambda: 'id(same_dec).set_gain(x);'

  - platform: template
    name: "SAME Burst Timeout"
    id: same_timeout_number
    icon: "mdi:timer-sand"
    unit_of_measurement: "s"
    min_value: 1
    max_value: 30
    step: 1
    mode: slider
    optimistic: true
    restore_value: true
    initial_value: 3
    entity_category: diagnostic
    set_action:
      - lambda: 'id(same_dec).set_timeout_ms((uint32_t) (x * 1000.0f));'

  - platform: template
    name: "SAME Decode Watchdog"
    id: same_watchdog_number
    icon: "mdi:timer-lock"
    unit_of_measurement: "s"
    min_value: 2
    max_value: 60
    step: 1
    mode: slider
    optimistic: true
    restore_value: true
    initial_value: 10
    entity_category: diagnostic
    disabled_by_default: true
    set_action:
      - lambda: 'id(same_dec).set_decode_watchdog_ms((uint32_t) (x * 1000.0f));'

  - platform: template
    name: "SAME Re-emit Suppress Window"
    id: same_resend_suppress_number
    icon: "mdi:timer-refresh"
    unit_of_measurement: "s"
    min_value: 0
    max_value: 900
    step: 1
    mode: slider
    optimistic: true
    restore_value: true
    initial_value: 3
    entity_category: diagnostic
    set_action:
      - lambda: 'id(same_dec).set_resend_suppress_ms((uint32_t) (x * 1000.0f));'

  # --- Preamble-lock tuning (redesign) ---
  - platform: template
    name: "SAME Preamble Energy Mult"
    id: same_pre_energy_number
    icon: "mdi:sine-wave"
    min_value: 2.0
    max_value: 50.0
    step: 0.5
    mode: slider
    optimistic: true
    restore_value: true
    initial_value: 8.0
    entity_category: diagnostic
    disabled_by_default: true
    set_action:
      - lambda: 'id(same_dec).set_preamble_energy_mult(x);'

# --- Per-event-code allow/mute toggles ---
# Semantics: switch ON = allow this event code (default). Switch OFF = mute it
# on-device (the alert will NOT publish to the filtered header sensor nor fire
# the Home Assistant event). Unknown/unlisted codes are always allowed.
