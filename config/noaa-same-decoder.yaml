# =============================================================================
#  NOAA Weather Radio SAME Decoder - AI-Thinker ESP32-Audio-Kit (ESP32-A1S / ES8388)
#  Repo location: config/noaa-same-decoder.yaml
#
#  Audio input path (schematic-verified):
#    J1 (line-in) -> INL/INR -> ES8388 ADC -> I2S DIN GPIO35 -> microphone: -> decoder
#  The microphone: component owns I2S input; its on_data trigger feeds bytes to
#  the same_decoder via feed_bytes(). This decouples us from low-level I2S API
#  churn (future-proof, idiomatic ESPHome).
#
#  Audio input selection:
#    LINE1 (default) = line-in (INL/INR), the intended decode source.
#    LINE2 = on-board mic. Selectable from Home Assistant via the "SAME ADC Input"
#    select for troubleshooting (entity disabled by default).
# =============================================================================

substitutions:
  device_name: "noaa-same-decoder"

esphome:
  name: ${device_name}
  friendly_name: "NOAA SAME Decoder"
  on_boot:
    priority: -100
    then:
      - lambda: 'ESP_LOGI("same", "Boot complete; SAME decoder starting.");'
      - select.set:
          id: same_adc_input
          option: "LINE1"              # line-in (was DIFFERENCE, which mixed mics + line-in)
      # --- Raise ES8388 input PGA gain (ADCControl1 = reg 0x09) ---
      # Both nibbles = per-channel MicAmp/PGA gain. 0x88 = +24 dB L & R.
      # Try 0x88 (24 dB) first; if it clips, drop to 0x66 (18) or 0x44 (12).
      - delay: 200ms
      - lambda: |-
          std::vector<uint8_t> buf;
          buf.push_back(0x09);
          buf.push_back(0x88);
          id(bus_a).write(0x10, buf.data(), buf.size());
          // Read it back to confirm it stuck:
          uint8_t reg = 0x09;
          uint8_t readback = 0;
          id(bus_a).write(0x10, &reg, 1, false);   // set pointer, no stop
          id(bus_a).read(0x10, &readback, 1);
          ESP_LOGI("es8388", "ADCControl1 wrote 0x88, readback=0x%02X", readback);
      - microphone.capture: same_mic

esp32:
  board: esp-wrover-kit
  framework:
    type: esp-idf
    advanced:
      minimum_chip_revision: "3.1"
      sram1_as_iram: true
psram:
  mode: quad
  speed: 80MHz

logger:
  level: DEBUG                          # DEBUG shows staged decode logs; raise to INFO later

api:
  encryption:
    key: !secret noaa_same_decoder__encryption_key
  # For production add: encryption: { key: !secret api_key }

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none                 # keep radio fully awake so WiFi work never starves the I2S/audio task (roaming stays enabled)
  ap:
    ssid: "${device_name} Fallback"
    password: !secret fallback_password

captive_portal:

# Debug component drives the diagnostic sensors below (CPU freq, free heap).
debug:
  update_interval: 30s

external_components:
  - source:
      type: git
      url: https://github.com/infinitytec/ESPHome-SAME-Decoder
      ref: main
    components: [same_decoder]
    refresh: 0s

i2c:
  sda: GPIO33
  scl: GPIO32
  frequency: 100kHz
  id: bus_a

audio_dac:
  - platform: es8388
    id: es8388_codec
    i2c_id: bus_a
    address: 0x10

select:
  - platform: es8388
    es8388_id: es8388_codec
    adc_input_mic:
      id: same_adc_input
      name: "SAME ADC Input (LINE1=Line-In, LINE2=Mic)"   # LINE1 | LINE2 | DIFFERENCE (hardcoded by es8388 component)
      disabled_by_default: true

# I2S Audio bus (shared clock/pins). The microphone platform below uses it.
i2s_audio:
  - id: i2s_in
    i2s_lrclk_pin: GPIO25
    i2s_bclk_pin: GPIO27
    i2s_mclk_pin: GPIO0

# Microphone owns the I2S RX path (external ES8388 ADC on GPIO35).
# on_data forwards raw PCM bytes to the decoder's feed_bytes().
microphone:
  - platform: i2s_audio
    id: same_mic
    i2s_audio_id: i2s_in
    adc_type: external
    i2s_din_pin: GPIO35
    sample_rate: 48000
    bits_per_sample: 16bit             # forwarded samples are int16
    channel: right                     # single mono channel into the demod
    on_data:
      then:
        - lambda: |-
            id(same_dec).feed_bytes(x);

# Remote reboot from Home Assistant.
button:
  - platform: restart
    name: "Restart"
    id: same_restart
    icon: "mdi:restart"

# -----------------------------------------------------------------------------
#  On-board LED outputs (AI-Thinker ESP32-A1S Audio Kit).
#  Board LED map (per user's board notes):
#    LED1 = battery charge   (hardware, NOT GPIO-controllable)
#    LED2 = battery standby  (hardware, NOT GPIO-controllable)
#    LED3 = 3V3 power        (hardware, always on when powered - cannot be
#                             turned off in software; this is the "always-on"
#                             LED you saw at power-up)
#    LED4 = GPIO22           (GPIO-controllable)  <-- used here
#    LED5 = GPIO19           (GPIO-controllable, but SHARED with Key 3)
#
#  These LEDs are active-LOW on this board, so `inverted: true`.
#  We drive LED4 (GPIO22) as the "decode-in-progress" indicator. GPIO22 is
#  preferred over GPIO19 because GPIO19 is shared with Key 3 and would conflict
#  if that key is ever enabled.
# -----------------------------------------------------------------------------
output:
  - platform: gpio
    id: led_decode_output
    pin:
      number: GPIO22
      inverted: true                   # active-LOW LED on this board

light:
  - platform: binary
    id: decode_light
    name: "SAME Decode In Progress"
    output: led_decode_output
    icon: "mdi:access-point"
    restore_mode: ALWAYS_OFF           # off at boot; turns on when a signal (ZCZC) is detected

# Runtime-adjustable controls (sliders).
#  - SAME Software Gain: multiplies incoming PCM before the demod. Persists.
#  - SAME Burst Timeout: if 1-2 header bursts are collected but the 3rd never
#    arrives within this many seconds, emit what we have and reset. Now enabled
#    by default and defaulted to 3s so a missed/clipped burst on a live radio
#    feed is flushed promptly (the C++ early-emit handles the file case where
#    audio ends before the timeout could fire).
#
#  NOTE: template numbers use `optimistic: true` (+ restore_value/initial_value)
#  and therefore CANNOT also define a `lambda:` value-reader (ESPHome forbids
#  combining them). The slider is the single source of truth: its stored value
#  is restored on boot and re-applied to the decoder via set_action. Because the
#  decoder's gain/timeout are only ever changed through these sliders, the
#  reported value always matches the decoder state.
number:
  - platform: template
    name: "SAME Software Gain"
    id: same_gain_number
    icon: "mdi:volume-high"
    min_value: 1
    max_value: 512
    step: 1
    mode: slider
    optimistic: true
    restore_value: true
    initial_value: 192                 # raised default for low-level line-in captures
    set_action:
      - lambda: 'id(same_dec).set_gain(x);'

  - platform: template
    name: "SAME Burst Timeout"
    id: same_timeout_number
    icon: "mdi:timer-sand"
    unit_of_measurement: "s"
    min_value: 1
    max_value: 30
    step: 1
    mode: slider
    optimistic: true
    restore_value: true
    initial_value: 3                   # shortened backstop for live feeds (was 5)
    entity_category: config
    set_action:
      - lambda: 'id(same_dec).set_timeout_ms((uint32_t) (x * 1000.0f));'

# Diagnostic + decoder entities.
#  - same_decode_count / same_last_raw: the authoritative decode outputs.
#  - The remaining diagnostics (CPU, memory, RSSI) are disabled by default;
#    enable them in the Home Assistant UI when troubleshooting.
sensor:
  - platform: template
    id: same_decode_count
    name: "SAME Decodes (session)"
    accuracy_decimals: 0
    unit_of_measurement: "decodes"

  # WiFi signal strength (RSSI).
  - platform: wifi_signal
    name: "RSSI"
    id: rssi_dbm
    update_interval: 60s
    unit_of_measurement: "dBm"
    device_class: signal_strength
    entity_category: diagnostic
    disabled_by_default: true

  # CPU frequency + free heap from the debug component.
  - platform: debug
    free:
      name: "Memory Free"
      entity_category: diagnostic
      disabled_by_default: true
    cpu_frequency:
      name: "CPU Frequency"
      entity_category: diagnostic
      disabled_by_default: true

text_sensor:
  - platform: template
    id: same_last_raw
    name: "SAME Last Raw Header"

# -----------------------------------------------------------------------------
#  The SAME decoder. Receives PCM via feed_bytes() (from microphone on_data),
#  runs a non-blocking dual-Goertzel AFSK state machine, and fires
#  esphome.same_alert for EVERY decoded alert. Uses same_event_codes.h for the
#  event name + default severity per 3-letter SAME code.
#    REAL    = present in the SAME header
#    DERIVED = computed (code table, purge->timestamp, hash)
#
#  on_sync fires the moment a ZCZC preamble is acquired (signal detected /
#  decode-in-progress). We use it to light LED4 (GPIO22). The light auto-turns
#  off after 8s, and on_alert also turns it off as a backstop once a decode
#  completes.
# -----------------------------------------------------------------------------
same_decoder:
  id: same_dec
  gain: 192.0
  sample_rate: 48000
  decode_count_sensor: same_decode_count
  last_raw_sensor: same_last_raw
  on_sync:
    then:
      # Signal detected: turn the decode-in-progress LED on, then auto-off after
      # 8s in case no full decode completes (e.g. a clipped/failed burst).
      - light.turn_on: decode_light
      - delay: 8s
      - light.turn_off: decode_light
  on_alert:
    then:
      # Backstop: a full decode finished, clear the decode-in-progress LED.
      - light.turn_off: decode_light
      - homeassistant.event:
          event: esphome.same_alert
          data:
            id: !lambda 'return id(same_dec).last_alert_id();'
            event_code: !lambda 'return id(same_dec).last_event_code();'
            event: !lambda 'return id(same_dec).last_event_name();'
            severity: !lambda 'return id(same_dec).last_severity();'
            originator: !lambda 'return id(same_dec).last_originator();'
            status: !lambda 'return id(same_dec).last_status();'
            areas: !lambda 'return id(same_dec).last_areas_csv();'
            onset: !lambda 'return id(same_dec).last_onset_iso();'
            expires: !lambda 'return id(same_dec).last_expires_iso();'
            sender: !lambda 'return id(same_dec).last_sender();'
            raw: !lambda 'return id(same_dec).last_raw_header();'
