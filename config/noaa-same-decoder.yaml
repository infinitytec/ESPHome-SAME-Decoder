                data:
                  id: !lambda 'return id(same_dec).last_alert_id();'
                  event_code: !lambda 'return id(same_dec).last_event_code();'
                  event: !lambda 'return id(same_dec).last_event_name();'
                  severity: !lambda 'return id(same_dec).last_severity();'
                  originator: !lambda 'return id(same_dec).last_originator();'
                  status: !lambda 'return id(same_dec).last_status();'
                  areas: !lambda 'return id(same_dec).last_areas_csv();'
