# =============================================================================
#  SAME Alerts - Consolidated Package
#  For the ESPHome SAME Decoder + weather_alerts_card (seevee/weather_alerts_card)
#
#  This package hosts ONE card-facing trigger-based template sensor per location
#  that consumes the blueprint's `same.alert_enriched` events and maintains a
#  weather_alerts_card / nws_alerts-style "Alerts" attribute (state = count),
#  with add/update/remove handling and minute-tick expiry pruning.
#
#  HARDENED against `unavailable`:
#    - The blueprint emits `alert` as a JSON string (| to_json). This sensor
#      parses it back with from_json, so timestamp strings are never upcast to
#      datetime objects (which would break attribute JSON serialization).
#    - Accepts either a JSON string or a real mapping for `alert`.
#    - `trigger is defined` guard so the minute tick never touches trigger.event
#    - `a is mapping` checks so a non-dict element can never throw
#    - prior-state coerced safely (iterable and not string) before | list
#    - dedup/prune read both id/ID and expires/Expires/ends/Ends
#    - namespace-based list building in both state and Alerts templates
#
#  ROUTING:
#    - The blueprint fires event `same.alert_enriched` with a location_key.
#      Keep the blueprint instance's location_key set to "home" (its default) to
#      match the sensor below.
#
#  INSTALL:
#    1. configuration.yaml must have:
#         homeassistant:
#           packages: !include_dir_named packages
#    2. Save as <config>/packages/same-alerts-package.yaml
#    3. Restart Home Assistant (or reload Template Entities).
#    4. Import the NOAA SAME Alerts blueprint once; create one automation,
#       leaving location_key at "home" to match the sensor.
#    5. Point weather_alerts_card at sensor.same_alerts_home.
#
#  DOCS:
#    - Trigger-based templates:   https://www.home-assistant.io/integrations/template/#trigger-based-template-entities
#    - weather_alerts_card:       https://github.com/seevee/weather_alerts_card
#    - nws_alerts (format ref):   https://github.com/finity69x2/nws_alerts
# =============================================================================
template:
  - trigger:
      - trigger: event
        event_type: same.alert_enriched
        id: enriched
      - trigger: time_pattern
        minutes: "/1"
        id: tick
    sensor:
      # ===== Location: home =====
      - name: "SAME Alerts (Home)"
        unique_id: same_alerts_home
        icon: "mdi:alert"
        state: >-
          {% set location_key = 'home' %}
          {% set now_ts = as_timestamp(now()) %}
          {% set prior = state_attr(this.entity_id, 'Alerts') %}
          {% set current = (prior if prior is iterable and prior is not string else []) | list %}
          {% if trigger is defined and trigger.id == 'enriched' %}
            {% set data = trigger.event.data | default({}, true) %}
            {% if (data.location_key | default('')) == location_key %}
              {% set action = data.action | default('add') %}
              {% set raw = data.alert | default({}, true) %}
              {% set alert = (raw | from_json) if raw is string else raw %}
              {% set rid = (alert.id | default(alert.ID | default('')) | string) if alert is mapping else '' %}
              {% set ns = namespace(keep=[]) %}
              {% for a in current %}
                {% if a is mapping and (a.id | default(a.ID | default('')) | string) != rid %}
                  {% set ns.keep = ns.keep + [a] %}
                {% endif %}
              {% endfor %}
              {% if action in ['add', 'update'] and rid != '' and alert is mapping %}
                {% set ns.keep = ns.keep + [alert] %}
              {% endif %}
              {% set current = ns.keep %}
            {% endif %}
          {% endif %}
          {% set ns2 = namespace(keep=[]) %}
          {% for a in current %}
            {% if a is mapping %}
              {% set exp = a.expires | default(a.Expires | default(a.ends | default(a.Ends | default('')))) %}
              {% set exp_ts = as_timestamp(exp, 0) %}
              {% if exp_ts == 0 or exp_ts > now_ts %}
                {% set ns2.keep = ns2.keep + [a] %}
              {% endif %}
            {% endif %}
          {% endfor %}
          {{ ns2.keep | count }}
        attributes:
          Alerts: >-
            {% set location_key = 'home' %}
            {% set now_ts = as_timestamp(now()) %}
            {% set prior = state_attr(this.entity_id, 'Alerts') %}
            {% set current = (prior if prior is iterable and prior is not string else []) | list %}
            {% if trigger is defined and trigger.id == 'enriched' %}
              {% set data = trigger.event.data | default({}, true) %}
              {% if (data.location_key | default('')) == location_key %}
                {% set action = data.action | default('add') %}
                {% set raw = data.alert | default({}, true) %}
                {% set alert = (raw | from_json) if raw is string else raw %}
                {% set rid = (alert.id | default(alert.ID | default('')) | string) if alert is mapping else '' %}
                {% set ns = namespace(keep=[]) %}
                {% for a in current %}
                  {% if a is mapping and (a.id | default(a.ID | default('')) | string) != rid %}
                    {% set ns.keep = ns.keep + [a] %}
                  {% endif %}
                {% endfor %}
                {% if action in ['add', 'update'] and rid != '' and alert is mapping %}
                  {% set ns.keep = ns.keep + [alert] %}
                {% endif %}
                {% set current = ns.keep %}
              {% endif %}
            {% endif %}
            {% set ns2 = namespace(keep=[]) %}
            {% for a in current %}
              {% if a is mapping %}
                {% set exp = a.expires | default(a.Expires | default(a.ends | default(a.Ends | default('')))) %}
                {% set exp_ts = as_timestamp(exp, 0) %}
                {% if exp_ts == 0 or exp_ts > now_ts %}
                  {% set ns2.keep = ns2.keep + [a] %}
                {% endif %}
              {% endif %}
            {% endfor %}
            {{ ns2.keep }}
          friendly_name: "SAME Alerts (Home)"
          icon: "mdi:alert"
