# =============================================================================
#  SAME Alerts Package
#  Easy drop-in for the ESPHome SAME Decoder.
#
#  Install:
#    1. Copy this file to <config>/packages/same_alerts_package.yaml
#    2. In configuration.yaml make sure you have:
#         homeassistant:
#           packages: !include_dir_named packages
#    3. Restart Home Assistant
#    4. Edit the helpers in Settings → Devices & Services → Helpers
#       (or Developer Tools → States) to set your FIPS codes, etc.
# =============================================================================

input_text:
  same_fips_list:
    name: "SAME FIPS Codes to Monitor"
    max: 255
    initial: ""
    icon: mdi:map-marker-radius
    # Comma-separated 6-digit codes, e.g. 012057,012081
    # Leave blank to accept all areas.

  same_event_enabled:
    name: "SAME Enabled Event Codes"
    max: 255
    initial: "TOR,SVR,TOA,SVA,FFW,FFA,FLW,FLA,EWW,HUW,HUA,TRW,TRA,WSW,WSA,BZW,SQW,SMW,DSW,CFW,CFA,SSW,SSA,EQW,VOW,HMW,RHW,NUW,SPW,EVI,CDW,CEM,LEW,CAE,LAE"
    icon: mdi:weather-lightning
    # Comma-separated. Only these codes are kept (after FIPS filter).
    # Blank = allow all non-excluded codes.

  same_event_always_alert:
    name: "SAME Always-Alert Event Codes"
    max: 255
    initial: "TOR,EAN,EAT,EVI,CDW"
    icon: mdi:alert-decagram
    # These codes always generate a notification even if the optional
    # NWS Alerts location cross-check fails.

  same_event_exclude:
    name: "SAME Event Codes to Exclude"
    max: 255
    initial: "RWT,RMT,NPT,DMO,NAT,NST"
    icon: mdi:cancel
    # Always dropped (useful for tests).

input_boolean:
  same_ignore_tests:
    name: "SAME Ignore Test Alerts"
    initial: true
    icon: mdi:test-tube
    # When on, drops the classic test codes regardless of the lists above.

# -----------------------------------------------------------------------------
#  sensor.same_alerts  (nws_alerts-style entity)
# -----------------------------------------------------------------------------
template:
  - trigger:
      - platform: event
        event_type: esphome.same_alert
      - platform: time_pattern
        minutes: "/1"
      - platform: homeassistant
        event: start
    action:
      - variables:
          existing: "{{ state_attr('sensor.same_alerts', 'Alerts') | default([], true) }}"
          now_ts: "{{ now() }}"
          fips_cfg: >
            {{ states('input_text.same_fips_list')
               | replace(' ', '') | upper
               | split(',') | reject('equalto', '') | list }}
          enabled_cfg: >
            {{ states('input_text.same_event_enabled')
               | replace(' ', '') | upper
               | split(',') | reject('equalto', '') | list }}
          exclude_cfg: >
            {{ states('input_text.same_event_exclude')
               | replace(' ', '') | upper
               | split(',') | reject('equalto', '') | list }}
          ignore_tests: "{{ is_state('input_boolean.same_ignore_tests', 'on') }}"
          test_codes: "{{ ['RWT', 'RMT', 'NPT', 'DMO', 'NAT', 'NST'] }}"
          ev: "{{ trigger.event.data if trigger.platform == 'event' else none }}"
    sensor:
      - name: "SAME Alerts"
        unique_id: same_alerts_reconstructed
        state: >
          {% set kept = namespace(list=[]) %}
          {% for a in existing %}
            {% if a.Expires is not defined
                  or as_datetime(a.Expires) is none
                  or as_datetime(a.Expires) > now_ts %}
              {% set kept.list = kept.list + [a] %}
            {% endif %}
          {% endfor %}
          {% if ev %}
            {% set code = (ev.event_code | default('')) | upper %}
            {% set areas = (ev.areas | default('')) | replace(' ', '')
                            | upper | split(',') | reject('equalto', '') | list %}
            {% set fips_ok = (fips_cfg | length == 0)
                             or (areas | select('in', fips_cfg) | list | length > 0) %}
            {% set enabled_ok = (enabled_cfg | length == 0) or (code in enabled_cfg) %}
            {% set exclude_ok = code not in exclude_cfg %}
            {% set test_ok = (not ignore_tests) or (code not in test_codes) %}
            {% if fips_ok and enabled_ok and exclude_ok and test_ok %}
              {% set item = {
                   'ID': ev.id | default(''),
                   'Event': ev.event | default(code),
                   'NWSCode': code,
                   'Severity': ev.severity | default('Unknown'),
                   'Status': ev.status | default('Actual'),
                   'Originator': ev.originator | default(''),
                   'Onset': ev.onset | default(''),
                   'Expires': ev.expires | default(''),
                   'Ends': ev.expires | default(''),
                   'AreasAffected': ev.areas | default(''),
                   'Sender': ev.sender | default(''),
                   'Raw': ev.raw | default('')
                 } %}
              {% set ns = namespace(list=[], found=false) %}
              {% for a in kept.list %}
                {% if a.ID == item.ID and item.ID != '' %}
                  {% set ns.list = ns.list + [item] %}
                  {% set ns.found = true %}
                {% else %}
                  {% set ns.list = ns.list + [a] %}
                {% endif %}
              {% endfor %}
              {% if not ns.found %}
                {% set ns.list = ns.list + [item] %}
              {% endif %}
              {% set kept.list = ns.list %}
            {% endif %}
          {% endif %}
          {{ kept.list | length }}
        attributes:
          Alerts: >
            {% set kept = namespace(list=[]) %}
            {% for a in existing %}
              {% if a.Expires is not defined
                    or as_datetime(a.Expires) is none
                    or as_datetime(a.Expires) > now_ts %}
                {% set kept.list = kept.list + [a] %}
              {% endif %}
            {% endfor %}
            {% if ev %}
              {% set code = (ev.event_code | default('')) | upper %}
              {% set areas = (ev.areas | default('')) | replace(' ', '')
                              | upper | split(',') | reject('equalto', '') | list %}
              {% set fips_ok = (fips_cfg | length == 0)
                               or (areas | select('in', fips_cfg) | list | length > 0) %}
              {% set enabled_ok = (enabled_cfg | length == 0) or (code in enabled_cfg) %}
              {% set exclude_ok = code not in exclude_cfg %}
              {% set test_ok = (not ignore_tests) or (code not in test_codes) %}
              {% if fips_ok and enabled_ok and exclude_ok and test_ok %}
                {% set item = {
                     'ID': ev.id | default(''),
                     'Event': ev.event | default(code),
                     'NWSCode': code,
                     'Severity': ev.severity | default('Unknown'),
                     'Status': ev.status | default('Actual'),
                     'Originator': ev.originator | default(''),
                     'Onset': ev.onset | default(''),
                     'Expires': ev.expires | default(''),
                     'Ends': ev.expires | default(''),
                     'AreasAffected': ev.areas | default(''),
                     'Sender': ev.sender | default(''),
                     'Raw': ev.raw | default('')
                   } %}
                {% set ns = namespace(list=[], found=false) %}
                {% for a in kept.list %}
                  {% if a.ID == item.ID and item.ID != '' %}
                    {% set ns.list = ns.list + [item] %}
                    {% set ns.found = true %}
                  {% else %}
                    {% set ns.list = ns.list + [a] %}
                  {% endif %}
                {% endfor %}
                {% if not ns.found %}{% set ns.list = ns.list + [item] %}{% endif %}
                {% set kept.list = ns.list %}
              {% endif %}
            {% endif %}
            {{ kept.list }}
          last_event: "{{ ev.event | default('') if ev else '' }}"
          last_severity: "{{ ev.severity | default('') if ev else '' }}"
          friendly_name: "SAME Alerts"
          icon: "mdi:alert"
