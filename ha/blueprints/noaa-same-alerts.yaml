# =============================================================================
#  NOAA SAME Alerts (NWS Alerts sensor)
#  Import via Settings -> Automations & Scenes -> Blueprints -> Import Blueprint
#  (or copy to <config>/blueprints/automation/same_decoder/noaa_same_alerts.yaml)
#
#  ONE blueprint does everything for a single location:
#    - Listens for the ESPHome decoder's SAME alert event (configurable name).
#    - FIPS-filters, suppresses silent test codes.
#    - Validates/enriches against the HACS nws_alerts sensor's `Alerts` attribute
#      (NO api.weather.gov / REST calls).
#    - Emits the output event for the per-location template sensor (card).
#    - SENDS NOTIFICATIONS inline at each decision point (new / confirmed / clear).
#
#  DECISION MODEL
#    * online sensor off/unavailable OR NWS Alerts sensor unavailable
#                                      -> FIRE SAME fallback (validated_by=offline
#                                         or sensor_unavailable)
#    * sensor available + matching entry in Alerts list
#                                      -> FIRE + ENRICH (validated_by=nws_sensor)
#    * sensor available + no matching entry
#                                      -> SUPPRESS (do not fire)
#    * SAME status "Cancel"            -> CLEAR (remove) immediately
#
#  MATCHING
#    A SAME alert matches an entry in the sensor's `Alerts` list when the event
#    code (NWSCode) matches (or the event name matches) AND their expiration
#    times are within match_tolerance_seconds (onset too, when both present).
#
#  NOTIFICATIONS
#    - New alert: a notification is sent on every FIRE (offline/sensor_unavailable
#      fallback, or enriched), subject to the optional severity allowlist.
#    - Clear: optional notify on SAME Cancel (notify_on_clear).
#    - tag / notification_id = same_<id> so updates REPLACE rather than stack.
#
#  DOCS
#    - nws_alerts integration:  https://github.com/finity69x2/nws_alerts
#    - Blueprints:              https://www.home-assistant.io/docs/blueprint/
#    - Template sensor:         https://www.home-assistant.io/integrations/template/#sensor
#    - mobile notifications:    https://www.home-assistant.io/integrations/notify/
# =============================================================================
blueprint:
  name: NOAA SAME Alerts (NWS Alerts sensor)
  description: >
    Enriches ESPHome SAME alerts for one location by reading the HACS nws_alerts
    sensor's `Alerts` attribute (no api.weather.gov calls), maintains the
    per-location card sensor, and sends notifications inline.
  domain: automation
  input:
    # =========================================================================
    #  REQUIRED INPUTS
    # =========================================================================
    location_key:
      name: (Required) Location key
      description: >
        Short tag identifying this location. MUST match the location_key set on
        the per-location template sensor (e.g. "home", "cabin").
      default: home
      selector:
        text:

    trigger_event:
      name: (Required) Trigger event type
      description: >
        The event fired by your ESPHome SAME decoder that starts this automation.
        Leave the default unless your decoder fires a differently-named event.
      default: esphome.same_alert
      selector:
        text:

    output_event:
      name: (Required) Output event (to the alert-card sensor)
      description: >
        The event this blueprint fires with the enriched/validated alert data.
        Your per-location template sensor that feeds the alert cards must listen
        for THIS event. Leave the default unless you renamed the sensor's event.
      default: same.alert_enriched
      selector:
        text:

    fips_code:
      name: (Required) FIPS / SAME county code
      description: >
        The county code for this location, as SSCCC (5-digit) or PSSCCC
        (6-digit). Only the last 5 digits are compared, so the P (partial-county)
        digit is ignored.
      selector:
        text:

    online_sensor:
      name: (Required) Online / Internet indicator
      description: >
        Any binary_sensor, input_boolean (toggle helper), or switch that is ON
        when Internet/NWS is reachable. When OFF or unavailable, the alert is
        fired as a SAME fallback without consulting the NWS Alerts sensor.
      selector:
        entity:
          domain:
            - binary_sensor
            - input_boolean
            - switch

    nws_alerts_entity:
      name: (Required) NWS Alerts sensor entity
      description: >
        The HACS nws_alerts sensor for this location whose `Alerts` attribute
        holds the list of active alerts. If this entity is unavailable/unknown,
        the alert is fired as a SAME (radio-only) fallback.
      selector:
        entity:
          domain: sensor

    # =========================================================================
    #  OPTIONAL INPUTS
    # =========================================================================
    match_tolerance_seconds:
      name: (Optional) Time match tolerance (seconds)
      description: >
        A NWS alert matches the SAME alert if the event type matches AND their
        expiration times are within this many seconds (and onset times too, when
        both are present).
      default: 120
      selector:
        number:
          min: 0
          max: 900
          step: 5
          unit_of_measurement: s
          mode: box

    suppress_test_codes:
      name: (Optional) Silent test codes
      description: >
        Comma-separated SAME event codes to silently ignore (tests).
      default: "RWT,RMT,NPT,DMO,NAT,NST"
      selector:
        text:

    # ---- Notification inputs (all optional) ----
    notify_service:
      name: (Optional) Notify service
      description: >
        Notify service to call, e.g. notify.mobile_app_your_phone. Leave blank
        to skip the mobile/push notification (persistent notifications still work
        if enabled below).
      default: ""
      selector:
        text:

    create_persistent:
      name: (Optional) Also create a persistent notification
      default: false
      selector:
        boolean:

    notify_on_clear:
      name: (Optional) Notify when an alert clears
      description: >
        Notify on a SAME Cancel clear.
      default: false
      selector:
        boolean:

    severity_allowlist:
      name: (Optional) Notify only for these severities
      description: Leave empty to notify for all severities.
      default: []
      selector:
        select:
          multiple: true
          mode: list
          options:
            - Extreme
            - Severe
            - Moderate
            - Minor
            - Unknown

    title_prefix:
      name: (Optional) Notification title prefix
      description: Prepended to the notification title (e.g. "Home").
      default: ""
      selector:
        text:

# Parallel so overlapping alerts never block each other.
mode: parallel
max: 10

trigger:
  - platform: event
    event_type: !input trigger_event

variables:
  # ---- Blueprint inputs pulled into variables ----
  location_key: !input location_key
  output_event: !input output_event
  fips_input: !input fips_code
  online_sensor: !input online_sensor
  nws_alerts_entity: !input nws_alerts_entity
  tol: !input match_tolerance_seconds
  suppress_test_codes: !input suppress_test_codes
  notify_service: !input notify_service
  create_persistent: !input create_persistent
  notify_on_clear: !input notify_on_clear
  severity_allowlist: !input severity_allowlist
  title_prefix: !input title_prefix

  # ---- SAME event payload (from the ESPHome decoder) ----
  ev: "{{ trigger.event.data }}"
  same_id: "{{ ev.id | default('') }}"
  same_event_code: "{{ ev.event_code | default('') | upper }}"
  same_event_text: "{{ ev.event | default('') }}"
  same_status: "{{ ev.status | default('') }}"
  same_onset: "{{ ev.onset | default('') }}"
  same_expires: "{{ ev.expires | default('') }}"
  same_onset_ts: "{{ as_timestamp(same_onset, 0) if (same_onset is string and same_onset != '') else 0 }}"
  same_expires_ts: "{{ as_timestamp(same_expires, 0) if (same_expires is string and same_expires != '') else 0 }}"

  # ---- County normalization: last 5 digits (SSCCC), ignoring P-digit ----
  ssccc: >-
    {% set s = fips_input | string %}
    {{ s[-5:] if s | length >= 5 else s }}

  # ---- SAME 'areas' list (kept for downstream use) ----
  areas: >-
    {{ (ev.areas | default('') | string).split(',') | map('trim') | reject('equalto', '') | list }}

  # ---- Whether the SAME areas include our county (SELF-CONTAINED) ----
  areas_contains_ssccc: >-
    {% set s = fips_input | string %}
    {% set my5 = s[-5:] if s | length >= 5 else s %}
    {% set alist = (ev.areas | default('') | string).split(',') | map('trim') | reject('equalto', '') | list %}
    {% set ns = namespace(ok=false) %}
    {% for a in alist %}
      {% if (a | string)[-5:] == my5 %}{% set ns.ok = true %}{% endif %}
    {% endfor %}
    {{ ns.ok | bool }}

  # ---- Silent test-code set ----
  suppress_set: >-
    {{ (suppress_test_codes | string | replace(' ', '')).split(',')
       | reject('equalto', '') | map('upper') | list }}
  is_test_code: "{{ same_event_code in suppress_set }}"

  # ---- NWS Alerts sensor read (replaces api.weather.gov) ----
  nws_sensor_state: "{{ states(nws_alerts_entity) }}"
  nws_sensor_available: "{{ nws_sensor_state not in ['unknown', 'unavailable', '', 'none'] }}"
  nws_alerts_list: "{{ state_attr(nws_alerts_entity, 'Alerts') | default([], true) | list }}"
  online_ok: "{{ is_state(online_sensor, 'on') }}"

  # ---- SAME event_code -> NWS event-name map (common codes) ----
  event_name_map: >-
    {{
      {
        'TOR': 'Tornado Warning',
        'SVR': 'Severe Thunderstorm Warning',
        'TOA': 'Tornado Watch',
        'SVA': 'Severe Thunderstorm Watch',
        'FFW': 'Flash Flood Warning',
        'FFA': 'Flash Flood Watch',
        'FFS': 'Flash Flood Statement',
        'FLW': 'Flood Warning',
        'FLA': 'Flood Watch',
        'FLS': 'Flood Statement',
        'EWW': 'Extreme Wind Warning',
        'BZW': 'Blizzard Warning',
        'WSW': 'Winter Storm Warning',
        'WSA': 'Winter Storm Watch',
        'HWW': 'High Wind Warning',
        'HWA': 'High Wind Watch',
        'HUW': 'Hurricane Warning',
        'HUA': 'Hurricane Watch',
        'HLS': 'Hurricane Statement',
        'TRW': 'Tropical Storm Warning',
        'TRA': 'Tropical Storm Watch',
        'SSW': 'Storm Surge Warning',
        'SSA': 'Storm Surge Watch',
        'SQW': 'Snow Squall Warning',
        'DSW': 'Dust Storm Warning',
        'SVS': 'Severe Weather Statement',
        'SPS': 'Special Weather Statement',
        'SMW': 'Special Marine Warning',
        'MWS': 'Marine Weather Statement',
        'FZW': 'Freeze Warning',
        'CFW': 'Coastal Flood Warning',
        'CFA': 'Coastal Flood Watch',
        'TSW': 'Tsunami Warning',
        'TSA': 'Tsunami Watch',
        'EQW': 'Earthquake Warning',
        'VOW': 'Volcano Warning',
        'FRW': 'Fire Warning',
        'HMW': 'Hazardous Materials Warning',
        'NUW': 'Nuclear Power Plant Warning',
        'RHW': 'Radiological Hazard Warning',
        'SPW': 'Shelter In Place Warning',
        'EVI': 'Evacuation Immediate',
        'CDW': 'Civil Danger Warning',
        'CEM': 'Civil Emergency Message',
        'LEW': 'Law Enforcement Warning',
        'LAE': 'Local Area Emergency',
        'CAE': 'Child Abduction Emergency',
        'AVW': 'Avalanche Warning',
        'AVA': 'Avalanche Watch',
        'TOE': '911 Telephone Outage Emergency',
        'ADR': 'Administrative Message',
        'BLU': 'Blue Alert'
      }
    }}

  # ---- Acceptable NWS event names (lowercased): mapped name + SAME text ----
  acceptable_events: >-
    {% set mapped = event_name_map.get(same_event_code) %}
    {{ [mapped, same_event_text] | reject('equalto', none) | reject('equalto', '')
       | map('string') | map('lower') | unique | list }}

condition: []

action:
  # ===========================================================================
  #  Early exits: cancel, wrong county, silent test codes, fallback
  # ===========================================================================
  - choose:
      # (a) SAME Cancel -> remove immediately (+ optional cleared notification).
      - conditions:
          - condition: template
            value_template: "{{ same_status | lower == 'cancel' }}"
        sequence:
          - event: "{{ output_event }}"
            event_data:
              location_key: "{{ location_key }}"
              action: remove
              alert:
                id: "{{ same_id }}"
          - if:
              - condition: template
                value_template: "{{ notify_on_clear }}"
            then:
              - if:
                  - condition: template
                    value_template: "{{ notify_service | length > 0 }}"
                then:
                  - service: "{{ notify_service }}"
                    data:
                      title: "{{ (title_prefix ~ ' ') if title_prefix | length > 0 else '' }}Alert cleared"
                      message: "{{ same_event_text | default('Weather alert') }} cleared. ID: {{ same_id }}"
                      data:
                        tag: "same_{{ same_id }}"
          # Always dismiss the persistent notification when the alert clears.
          - if:
              - condition: template
                value_template: "{{ create_persistent }}"
            then:
              - service: persistent_notification.dismiss
                data:
                  notification_id: "same_{{ same_id }}"
          - stop: "Handled SAME Cancel (removed)."

      # (b) Alert not for our county (safety net; device already FIPS-filters).
      - conditions:
          - condition: template
            value_template: "{{ areas_contains_ssccc | bool == false }}"
        sequence:
          - stop: "Not for this location (SSCCC mismatch)."

      # (c) Silent test code.
      - conditions:
          - condition: template
            value_template: "{{ is_test_code }}"
        sequence:
          - stop: "Suppressed silent test code."

      # (d) Offline OR NWS Alerts sensor unavailable -> fire SAME fallback, notify.
      - conditions:
          - condition: template
            value_template: "{{ (not online_ok) or (not nws_sensor_available) }}"
        sequence:
          - variables:
              validated_by: "{{ 'offline' if not online_ok else 'sensor_unavailable' }}"
              alert_for_notify:
                id: "{{ same_id }}"
                ID: "{{ same_id }}"
                same_id: "{{ same_id }}"
                Event: "{{ same_event_text }}"
                event: "{{ same_event_text }}"
                NWSCode: "{{ same_event_code }}"
                event_code: "{{ same_event_code }}"
                Severity: "{{ ev.severity | default('Unknown') }}"
                severity: "{{ ev.severity | default('Unknown') }}"
                Status: "{{ ev.status | default('Actual') }}"
                status: "{{ same_status }}"
                Originator: "{{ ev.originator | default('') }}"
                originator: "{{ ev.originator | default('') }}"
                Onset: "{{ same_onset }}"
                onset: "{{ same_onset }}"
                Expires: "{{ same_expires }}"
                expires: "{{ same_expires }}"
                Ends: "{{ same_expires }}"
                ends: "{{ same_expires }}"
                AreasAffected: "{{ ev.areas | default('') }}"
                areas: "{{ ev.areas | default('') }}"
                Sender: "{{ ev.sender | default('') }}"
                sender: "{{ ev.sender | default('') }}"
                Raw: "{{ ev.raw | default('') }}"
                raw: "{{ ev.raw | default('') }}"
                DisplayDesc: "{{ same_event_text }} for {{ ev.areas | default('your area') }}."
                SpokenDesc: "{{ same_event_text }} for your area."
                validated_by: "{{ validated_by }}"
                point_relevant: "unknown"
                confidence: "same_pending"
          - event: "{{ output_event }}"
            event_data:
              location_key: "{{ location_key }}"
              action: add
              alert: "{{ alert_for_notify }}"
          # ---- notify (new alert) ----
          - variables:
              _event: "{{ alert_for_notify.Event | default('Weather Alert') }}"
              _sev: "{{ (alert_for_notify.Severity | default('Unknown')) | title }}"
              _display: "{{ alert_for_notify.DisplayDesc | default(_event) }}"
              _expires_raw: "{{ alert_for_notify.Expires | default('') }}"
              _expires: >-
                {{ as_timestamp(_expires_raw) | timestamp_custom('%A, %B %-d at %-I:%M %p %Z', true)
                   if _expires_raw != '' else '' }}
              _id: "{{ alert_for_notify.ID | default('unknown') }}"
              _confidence_note: "Radio-only (offline or NWS Alerts sensor unavailable)"
              _should_notify: "{{ (severity_allowlist | length == 0) or (_sev in severity_allowlist) }}"
              _title: "{{ (title_prefix ~ ' ') if title_prefix | length > 0 else '' }}{{ _event }} ({{ _sev }})"
              _message: >-
                {{ _display }}
                {% if _confidence_note %}

                {{ _confidence_note }}{% endif %}
                {% if _expires %}

                Expires: {{ _expires }}{% endif %}
          - if:
              - condition: template
                value_template: "{{ _should_notify }}"
            then:
              - if:
                  - condition: template
                    value_template: "{{ notify_service | length > 0 }}"
                then:
                  - service: "{{ notify_service }}"
                    data:
                      title: "{{ _title }}"
                      message: "{{ _message }}"
                      data:
                        tag: "same_{{ _id }}"
              - if:
                  - condition: template
                    value_template: "{{ create_persistent }}"
                then:
                  - service: persistent_notification.create
                    data:
                      title: "{{ _title }}"
                      message: "{{ _message }}"
                      notification_id: "same_{{ _id }}"
          - stop: "Offline/sensor-unavailable SAME fallback fired + notified."

  # ===========================================================================
  #  Online + sensor available -> match against the sensor's Alerts list
  #  (event code OR event name) AND expires within tolerance (onset too if both).
  # ===========================================================================
  - variables:
      match: >-
        {%- set ns = namespace(best=none, best_exp=9999999, best_on=9999999) -%}
        {%- for a in nws_alerts_list -%}
          {%- set a_code = (a.NWSCode | default('') | upper) -%}
          {%- set a_event_name = (a.Event | default('') | lower) -%}
          {%- set a_expires = a.Expires | default(a.Ends | default('')) -%}
          {%- set a_expires_ts = as_timestamp(a_expires, 0) if (a_expires is string and a_expires != '') else 0 -%}
          {%- set exp_delta = ((a_expires_ts - same_expires_ts) | abs) if (a_expires_ts > 0 and same_expires_ts > 0) else 0 -%}
          {%- set a_onset = a.Onset | default('') -%}
          {%- set a_onset_ts = as_timestamp(a_onset, 0) if (a_onset is string and a_onset != '') else 0 -%}
          {%- set on_delta = ((a_onset_ts - same_onset_ts) | abs) if (a_onset_ts > 0 and same_onset_ts > 0) else 0 -%}
          {%- set onset_ok = (same_onset_ts == 0 or a_onset_ts == 0 or on_delta <= tol) -%}
          {%- if ((a_code == same_event_code) or (a_event_name in acceptable_events)) and (exp_delta <= tol) and onset_ok -%}
            {%- if (exp_delta < ns.best_exp) or (exp_delta == ns.best_exp and on_delta < ns.best_on) -%}
              {%- set ns.best = a -%}
              {%- set ns.best_exp = exp_delta -%}
              {%- set ns.best_on = on_delta -%}
            {%- endif -%}
          {%- endif -%}
        {%- endfor -%}
        {{ ns.best }}
      p_match: "{{ match is not none }}"

  - choose:
      # P true -> fire enriched + notify, done.
      - conditions:
          - condition: template
            value_template: "{{ p_match }}"
        sequence:
          - variables:
              hd: "{{ match.Headline | default('') }}"
              de: "{{ match.Description | default('') }}"
              alert_for_notify:
                id: "{{ same_id }}"
                ID: "{{ same_id }}"
                same_id: "{{ same_id }}"
                nws_id: "{{ match.ID | default('') }}"
                Event: "{{ match.Event | default(same_event_text) }}"
                event: "{{ match.Event | default(same_event_text) }}"
                NWSCode: "{{ same_event_code }}"
                event_code: "{{ same_event_code }}"
                Severity: "{{ match.Severity | default(ev.severity | default('Unknown')) }}"
                severity: "{{ match.Severity | default(ev.severity | default('Unknown')) }}"
                Certainty: "{{ match.Certainty | default('') }}"
                certainty: "{{ match.Certainty | default('') }}"
                Urgency: ""
                urgency: ""
                Status: "{{ match.Status | default(same_status | default('Actual')) }}"
                status: "{{ match.Status | default(same_status | default('Actual')) }}"
                MessageType: "{{ match.Type | default('') }}"
                Originator: "{{ ev.originator | default('') }}"
                originator: "{{ ev.originator | default('') }}"
                Onset: "{{ match.Onset | default(same_onset) }}"
                onset: "{{ match.Onset | default(same_onset) }}"
                Expires: "{{ match.Expires | default(match.Ends | default(same_expires)) }}"
                expires: "{{ match.Expires | default(match.Ends | default(same_expires)) }}"
                Ends: "{{ match.Ends | default(match.Expires | default(same_expires)) }}"
                ends: "{{ match.Ends | default(match.Expires | default(same_expires)) }}"
                AreasAffected: "{{ match.AreasAffected | default(ev.areas | default('')) }}"
                areas: "{{ ev.areas | default('') }}"
                Sender: "{{ ev.sender | default('') }}"
                sender: "{{ ev.sender | default('') }}"
                Description: "{{ de }}"
                Instruction: "{{ match.Instruction | default('') }}"
                Headline: "{{ hd }}"
                DisplayDesc: >-
                  {{ hd if hd != '' else (match.Event | default(same_event_text)) ~ ' for ' ~ (match.AreasAffected | default('your area')) ~ '.' }}
                SpokenDesc: >-
                  {{ hd if hd != '' else (match.Event | default(same_event_text)) ~ '. ' ~ (de[:240]) }}
                URL: "{{ match.URL | default('') }}"
                Raw: "{{ ev.raw | default('') }}"
                raw: "{{ ev.raw | default('') }}"
                validated_by: "nws_sensor"
                point_relevant: true
                confidence: "validated"
          - event: "{{ output_event }}"
            event_data:
              location_key: "{{ location_key }}"
              action: add
              alert: "{{ alert_for_notify }}"
          # ---- notify (new, NWS-confirmed alert) ----
          - variables:
              _event: "{{ alert_for_notify.Event | default('Weather Alert') }}"
              _sev: "{{ (alert_for_notify.Severity | default('Unknown')) | title }}"
              _display: "{{ alert_for_notify.DisplayDesc | default(_event) }}"
              _expires_raw: "{{ alert_for_notify.Expires | default('') }}"
              _expires: >-
                {{ as_timestamp(_expires_raw) | timestamp_custom('%A, %B %-d at %-I:%M %p %Z', true)
                   if _expires_raw != '' else '' }}
              _url: "{{ alert_for_notify.URL | default('') }}"
              _id: "{{ alert_for_notify.ID | default('unknown') }}"
              _should_notify: "{{ (severity_allowlist | length == 0) or (_sev in severity_allowlist) }}"
              _title: "{{ (title_prefix ~ ' ') if title_prefix | length > 0 else '' }}{{ _event }} ({{ _sev }})"
              _message: >-
                {{ _display }}

                Confirmed by NWS
                {% if _expires %}

                Expires: {{ _expires }}{% endif %}
                {% if _url %}

                {{ _url }}{% endif %}
          - if:
              - condition: template
                value_template: "{{ _should_notify }}"
            then:
              - if:
                  - condition: template
                    value_template: "{{ notify_service | length > 0 }}"
                then:
                  - service: "{{ notify_service }}"
                    data:
                      title: "{{ _title }}"
                      message: "{{ _message }}"
                      data:
                        tag: "same_{{ _id }}"
              - if:
                  - condition: template
                    value_template: "{{ create_persistent }}"
                then:
                  - service: persistent_notification.create
                    data:
                      title: "{{ _title }}"
                      message: "{{ _message }}"
                      notification_id: "same_{{ _id }}"
          - stop: "NWS sensor match enriched, fired + notified."

  # ===========================================================================
  #  Online + sensor available + NO matching entry -> SUPPRESS (fire nothing).
  # ===========================================================================
  - stop: "Suppressed: NWS Alerts sensor available but does not list this alert (not for us)."
