# =============================================================================
#  SAME Alert Notification Blueprint
#  Import via Settings → Automations & Scenes → Blueprints → Import Blueprint
#  (or copy to <config>/blueprints/automation/)
# =============================================================================
blueprint:
  name: SAME Alert Notification (with optional NWS cross-check)
  description: >
    Notifies on new SAME alerts that pass your FIPS + event-code filters.
    Optional: when Internet is up and an NWS Alerts sensor is provided,
    refresh that sensor twice (30 s apart) and only notify if the alert
    appears to match your location — unless the code is in the Always-Alert list.
  domain: automation
  input:
    same_alerts_sensor:
      name: SAME Alerts sensor
      description: The sensor created by the same_alerts package
      default: sensor.same_alerts
      selector:
        entity:
          domain: sensor

    notify_service:
      name: Notify service
      description: e.g. notify.mobile_app_your_phone
      selector:
        text:

    create_persistent:
      name: Create persistent notification
      default: true
      selector:
        boolean:

    # ---- Optional cross-check ----
    internet_sensor:
      name: Internet binary sensor (optional)
      description: Leave empty to skip online checks
      default: []
      selector:
        entity:
          domain: binary_sensor
          multiple: false

    nws_alerts_sensor:
      name: NWS Alerts sensor (optional)
      description: The sensor from the nws_alerts custom integration
      default: []
      selector:
        entity:
          domain: sensor
          multiple: false

    enable_crosscheck:
      name: Enable NWS location cross-check when online
      default: false
      selector:
        boolean:

    # ---- Helpers (normally left at defaults) ----
    fips_helper:
      name: FIPS codes helper
      default: input_text.same_fips_list
      selector:
        entity:
          domain: input_text

    enabled_helper:
      name: Enabled event codes helper
      default: input_text.same_event_enabled
      selector:
        entity:
          domain: input_text

    always_helper:
      name: Always-alert event codes helper
      default: input_text.same_event_always_alert
      selector:
        entity:
          domain: input_text

    exclude_helper:
      name: Exclude event codes helper
      default: input_text.same_event_exclude
      selector:
        entity:
          domain: input_text

    ignore_tests_helper:
      name: Ignore tests helper
      default: input_boolean.same_ignore_tests
      selector:
        entity:
          domain: input_boolean

variables:
  alerts_sensor: !input same_alerts_sensor
  notify_svc: !input notify_service
  do_persistent: !input create_persistent
  internet_ent: !input internet_sensor
  nws_ent: !input nws_alerts_sensor
  do_crosscheck: !input enable_crosscheck
  fips_ent: !input fips_helper
  enabled_ent: !input enabled_helper
  always_ent: !input always_helper
  exclude_ent: !input exclude_helper
  ignore_tests_ent: !input ignore_tests_helper

trigger:
  - platform: state
    entity_id: !input same_alerts_sensor

condition:
  # Only when the active-alert count increased
  - condition: template
    value_template: >
      {{ (trigger.to_state.state | int(0)) > (trigger.from_state.state | int(0)) }}

action:
  - variables:
      newest: >
        {{ (state_attr(alerts_sensor, 'Alerts') | default([], true)) | last
           if (state_attr(alerts_sensor, 'Alerts') | default([], true)) | length > 0
           else {} }}
      code: "{{ newest.NWSCode | default('') | upper }}"
      always_list: >
        {{ states(always_ent) | replace(' ', '') | upper
           | split(',') | reject('equalto', '') | list }}
      is_always: "{{ code in always_list }}"
      has_internet: >
        {{ internet_ent | length > 0 and is_state(internet_ent, 'on') }}
      has_nws: "{{ nws_ent | length > 0 }}"
      should_crosscheck: >
        {{ do_crosscheck and has_internet and has_nws and not is_always }}

  # ----- Optional NWS cross-check -----
  - if:
      - condition: template
        value_template: "{{ should_crosscheck }}"
    then:
      - service: homeassistant.update_entity
        target:
          entity_id: "{{ nws_ent }}"
      - delay: "00:00:30"
      - service: homeassistant.update_entity
        target:
          entity_id: "{{ nws_ent }}"
      - delay: "00:00:05"
      - variables:
          nws_alerts: "{{ state_attr(nws_ent, 'Alerts') | default([], true) }}"
          location_match: >
            {% set ns = namespace(found=false) %}
            {% for a in nws_alerts %}
              {% set nws_code = (a.Event | default('') ~ ' ' ~ a.NWSCode | default('')) | upper %}
              {% if code in nws_code or (newest.Event | default('')) in (a.Event | default('')) %}
                {% set areas = (a.AreasAffected | default('')) | upper %}
                {% set my_areas = (newest.AreasAffected | default('')) | upper %}
                {% if my_areas in areas or areas in my_areas or my_areas == '' %}
                  {% set ns.found = true %}
                {% endif %}
              {% endif %}
            {% endfor %}
            {{ ns.found }}
      - condition: template
        value_template: "{{ location_match or is_always }}"

  # ----- Build message -----
  - variables:
      title: "Weather Alert: {{ newest.Event | default(code) }}"
      message: >
        {{ newest.Event | default(code) }} ({{ newest.Severity | default('Unknown') }})
        for {{ newest.AreasAffected | default('your area') }}.
        {% if newest.Expires %}Expires {{ newest.Expires }}.{% endif %}
        {% if newest.Sender %} — {{ newest.Sender }}{% endif %}

  # ----- Mobile / service notification -----
  - service: "{{ notify_svc }}"
    data:
      title: "{{ title }}"
      message: "{{ message }}"

  # ----- Persistent notification (always a new one) -----
  - if:
      - condition: template
        value_template: "{{ do_persistent }}"
    then:
      - service: persistent_notification.create
        data:
          title: "{{ title }}"
          message: "{{ message }}"
          # No notification_id → brand-new card every time
